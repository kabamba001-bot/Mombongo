name: Build Android APK

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer les dépendances
        run: npm install

      - name: Préparer le dossier web (www/)
        run: |
          mkdir -p www
          cp index.html style.css manifest.json service-worker.js sitemap.xml www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          cp icon-*.png www/ 2>/dev/null || true

      - name: Empaqueter le pont d'authentification native
        run: npx esbuild native-auth-bridge.src.js --bundle --format=iife --outfile=www/native-auth-bridge.js --external:firebase/auth

      - name: Préparer l'icône de l'app native
        run: |
          mkdir -p assets
          cp icon-512.png assets/icon.png 2>/dev/null || cp icon-192.png assets/icon.png 2>/dev/null || true

      - name: Initialiser / synchroniser Capacitor
        run: |
          npx cap add android || true
          npx --yes @capacitor/assets generate --android
          sed -i "/com.android.tools.build:gradle/a\    classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          sed -i '/dependencies {/a \    implementation "com.google.android.gms:play-services-auth:21.2.0"' android/app/build.gradle
          npx cap sync android

      - name: Utiliser notre keystore stable (signature constante entre les builds)
        run: |
          mkdir -p ~/.android
          cp mombongo-debug.keystore ~/.android/debug.keystore

      - name: Placer google-services.json
        run: cp google-services.json android/app/google-services.json

      - name: Compiler l'APK (debug, non signé)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publier une release avec l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mombongo build ${{ github.run_number }}
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
