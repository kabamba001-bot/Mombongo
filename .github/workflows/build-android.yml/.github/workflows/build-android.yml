name: Build Android APK

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer les dépendances
        run: npm install

      - name: Préparer le dossier web (www/)
        run: |
          mkdir -p www
          cp index.html style.css manifest.json service-worker.js sitemap.xml www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          cp icon-*.png www/ 2>/dev/null || true

      - name: Initialiser / synchroniser Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Compiler l'APK (debug, non signé)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publier une release avec l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mombongo build ${{ github.run_number }}
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
