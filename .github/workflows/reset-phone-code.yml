name: Réinitialiser un code de connexion

# Se lance à la main : onglet "Actions" du dépôt GitHub → "Réinitialiser un
# code de connexion" → bouton "Run workflow" → remplis les 2 champs → Run.
# À utiliser quand un client te contacte sur WhatsApp (bouton "Code oublié ?"
# dans Mombongo) parce qu'il a oublié son code de connexion par numéro de
# téléphone. Voir phone-auth.js et reset-phone-code.js pour le détail.
on:
  workflow_dispatch:
    inputs:
      phone:
        description: "Numéro de téléphone du client (chiffres uniquement, indicatif du pays inclus, ex: 243812345678)"
        required: true
      code:
        description: "Nouveau code à lui donner (4 à 8 caractères, chiffres et/ou lettres)"
        required: true

jobs:
  reset-phone-code:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        working-directory: ./scripts
        run: npm install

      - name: Réinitialiser le code
        working-directory: ./scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node reset-phone-code.js --phone="${{ inputs.phone }}" --code="${{ inputs.code }}"
