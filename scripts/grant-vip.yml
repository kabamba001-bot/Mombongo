name: Accorder un palier VIP

# Se lance à la main : onglet "Actions" du dépôt GitHub → "Accorder un palier
# VIP" → bouton "Run workflow" → remplis les 3 champs → Run. Aucune ligne de
# commande, aucun accès à la console Firebase nécessaire. Voir grant-vip.js
# pour le détail de ce que ça modifie.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email du compte Google du client (celui utilisé dans Mombongo)"
        required: true
      plan:
        description: "Palier à accorder"
        required: true
        type: choice
        options:
          - simple
          - business
          - pro
      duration:
        description: "Durée"
        required: true
        type: choice
        options:
          - 1w
          - 2w
          - 1m
          - 2m
          - 3m
          - 6m
          - 1y

jobs:
  grant-vip:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        working-directory: ./scripts
        run: npm install

      - name: Accorder le palier
        working-directory: ./scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node grant-vip.js --email="${{ inputs.email }}" --plan="${{ inputs.plan }}" --duration="${{ inputs.duration }}"
